name: upstream-parity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[test]" --group parity
      - run: pytest -q -m parity
