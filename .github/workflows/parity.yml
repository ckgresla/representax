name: upstream-parity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test,parity]"
      - run: pytest -q -m parity
