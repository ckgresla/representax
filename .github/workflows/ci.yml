name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ".[test]"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install ".[test,data]"
      - run: pytest -q

  runtime:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install ".[test,data]"
      - run: pytest -q -m runtime tests/train

  distributed-cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      JAX_PLATFORMS: cpu
      XLA_FLAGS: --xla_force_host_platform_device_count=4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test]"
      - run: pytest -q -m distributed

  release-artifacts:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - run: python -m pip install dist/*.whl
      - run: python -c "import importlib.metadata as m; import jax; import representax; assert m.metadata('representax')['Name'] == 'representax'; assert jax.default_backend() == 'cpu'"
        working-directory: ${{ runner.temp }}
      - uses: actions/upload-artifact@v7
        with:
          name: representax-distributions
          path: dist/*
