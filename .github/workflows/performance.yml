name: performance

on:
  workflow_dispatch:

jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ".[test]"
      - run: pytest -q -s -m performance | tee performance.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-performance-reference
          path: performance.txt
