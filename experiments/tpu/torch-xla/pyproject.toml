[project]
name = "representax-tpu-torch-reference"
version = "0.0.0"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy>=2",
    "sentence-transformers[train]==5.6.1",
    "torch==2.9.0",
    "torch_xla[tpu]==2.9.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
