[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "representax"
version = "0.0.1"
description = "Task-general representation learning in JAX and Equinox."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.11"
authors = [{ name = "Chris Kerwell Gresla", email = "ckgresla@gmail.com" }]
maintainers = [{ name = "Chris Kerwell Gresla", email = "ckgresla@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "equinox>=0.11",
    "grain>=0.2",
    "jax>=0.5",
    "optax>=0.2.6",
    "orbax-checkpoint>=0.12,<0.13",
    "safetensors>=0.5",
]

[project.urls]
Homepage = "https://github.com/ckgresla/representax"
Repository = "https://github.com/ckgresla/representax"
Issues = "https://github.com/ckgresla/representax/issues"

[project.optional-dependencies]
config = [
    "hydra-core>=1.3",
    "hydra-zen>=0.15",
]
hf = [
    "datasets>=3",
    "huggingface-hub>=0.30",
    "pyarrow>=18",
    "tokenizers>=0.21",
    "transformers==5.3.0",
]
cuda12 = [
    "jax[cuda12]>=0.5",
]
cuda13 = [
    "jax[cuda13]>=0.5",
]
performance = [
    "nvidia-ml-py>=12",
]
test = [
    "pytest>=8",
    "ruff>=0.9",
]

[dependency-groups]
parity = [
    "sentence-transformers>=5",
    "torch>=2.5",
    "transformers==5.3.0",
]
parity-modernvbert = [
    "torch>=2.5",
    "transformers==5.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/representax"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/benchmarks/results",
    "/todo.org",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not runtime and not parity and not distributed and not performance'"
markers = [
    "runtime: compiled end-to-end training behavior",
    "parity: numerical comparison with an upstream implementation",
    "distributed: multi-device or multi-process behavior",
    "performance: compile-time, throughput, or memory measurement",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
